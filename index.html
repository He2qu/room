<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="静谧书房" />
  <title>Hi, Creator · 静谧书房 (iPad Air 定制版)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* 默认：石墨深色护眼 (Graphite Dark) */
    :root {
      --bg-deep: #111113;
      --bg-main: #161618;
      --bg-elevated: #1f1f23;
      --bg-hover: #28282d;
      --bubble-user: #2a2a30;
      --bubble-ai: #1c1c20;
      --border-subtle: #2c2c32;
      --border-strong: #46464f;
      --text-primary: #dcdce0;
      --text-dialogue: #f2f2f5;
      --text-secondary: #9898a2;
      --text-muted: #666670;
      --accent: #e4e4e8;
      --accent-contrast: #121214;
      --tag-bg: #242429;
      --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.38);
      --overlay-bg: rgba(8, 8, 10, 0.65);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --content-max-width: 820px; /* iPad Air 5 最佳阅读轴宽 */
    }

    /* 可切换：水墨纸张浅色护眼 (E-Ink Paper) */
    [data-theme="light"] {
      --bg-deep: #e4e4df;
      --bg-main: #efefeb;
      --bg-elevated: #e6e6e1;
      --bg-hover: #dadad4;
      --bubble-user: #dcdcd6;
      --bubble-ai: #fafaf7;
      --border-subtle: #d0d0c8;
      --border-strong: #a2a29a;
      --text-primary: #242427;
      --text-dialogue: #111113;
      --text-secondary: #5a5a62;
      --text-muted: #86868e;
      --accent: #222225;
      --accent-contrast: #f4f4f0;
      --tag-bg: #dfdfd9;
      --shadow-soft: 0 6px 24px rgba(0, 0, 0, 0.08);
      --overlay-bg: rgba(25, 25, 28, 0.42);
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--custom-font, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif);
      font-size: var(--base-font-size, 16px); /* iPad 默认 16px 阅读更舒适 */
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }

    #app {
      display: flex;
      height: 100%;
      height: 100dvh;
      width: 100vw;
      position: relative;
      overflow: hidden;
      background: var(--bg-main);
    }

    /* 侧边栏遮罩（竖屏/小分屏模式启用） */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 35;
      display: none;
    }
    .sidebar-backdrop.open { display: block; }

    /* 左侧会话抽屉：针对 iPad Air 5 横竖屏平滑切换优化 */
    .sidebar {
      width: 288px;
      max-width: 82vw;
      height: 100%;
      background: var(--bg-deep);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1),
                  margin-left 0.26s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 40;
      flex-shrink: 0;
    }

    /* 竖屏 (<800px) 或 iPad Split View 分屏时使用浮层抽屉 */
    @media (max-width: 799px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(0);
        box-shadow: var(--shadow-soft);
      }
      .sidebar.closed {
        transform: translateX(-105%);
      }
    }

    /* iPad Air 5 竖屏满屏(820px) & 横屏(1180px) 采用双栏并排 + 负边距动画 */
    @media (min-width: 800px) {
      .sidebar {
        position: relative;
        transform: none;
        margin-left: 0;
      }
      .sidebar.closed {
        margin-left: -288px;
        border-right-color: transparent;
      }
      #btnCloseSidebarMobile {
        display: none;
      }
    }

    .brand {
      height: 58px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-title {
      font-size: 1.02em;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-primary);
    }
    .new-chat-btn {
      margin: 14px 14px 8px;
      padding: 12px 15px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: 11px;
      cursor: pointer;
      font-size: 0.92em;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 500;
      transition: background 0.15s;
    }
    .new-chat-btn:hover, .new-chat-btn:active { background: var(--bg-hover); }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 12px 18px;
      -webkit-overflow-scrolling: touch;
    }
    .session-item {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .session-item:hover {
      background: var(--bg-hover);
    }
    .session-item.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }
    .session-info {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      padding-right: 8px;
    }
    .session-name {
      font-size: 0.94em;
      margin-bottom: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-time {
      font-size: 0.75em;
      color: var(--text-muted);
    }
    .session-actions {
      display: flex;
      gap: 5px;
    }
    .session-actions button {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.82em;
      padding: 5px 8px;
      border-radius: 7px;
    }
    .session-actions button:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* 主界面区域 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      padding-right: var(--safe-right);
    }

    /* 顶部导航栏：针对 iPad Air 5 宽屏舒展优化 */
    .header {
      padding-top: var(--safe-top);
      min-height: calc(58px + var(--safe-top));
      padding-left: 18px;
      padding-right: 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-main);
      z-index: 10;
      gap: 10px;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .icon-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      height: 38px;
      padding: 0 12px;
      border-radius: 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      user-select: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .icon-btn:hover, .icon-btn:active {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .icon-btn.highlight {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .badge-num {
      font-size: 0.8em;
      padding: 1px 6px;
      border-radius: 5px;
      background: var(--bg-hover);
      color: var(--text-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .model-select {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      height: 38px;
      padding: 0 12px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.86em;
      outline: none;
      max-width: 240px;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    @media (max-width: 560px) {
      .header { padding-left: 10px; padding-right: 10px; }
      .icon-btn { height: 34px; padding: 0 9px; font-size: 0.82em; }
      .model-select { height: 34px; max-width: 132px; font-size: 0.8em; }
    }

    /* 消息列表：iPad Air 5 居中阅读轴 + 左右对话气泡 */
    .messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 24px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    @media (max-width: 560px) {
      .messages { padding: 14px 12px 18px; gap: 18px; }
    }

    /* 让每条消息在 iPad 大屏居中阅读轴内排布 */
    .msg-track {
      width: 100%;
      max-width: var(--content-max-width);
      display: flex;
      flex-direction: column;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 84%;
      position: relative;
    }
    @media (max-width: 560px) {
      .msg-row { max-width: 88%; }
    }
    .msg-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    .msg-row.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    /* 消息顶部元信息栏 */
    .msg-header {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
      padding: 0 3px;
      font-size: 0.76em;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .msg-row.user .msg-header {
      flex-direction: row-reverse;
    }
    .msg-floor {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .msg-sender {
      font-weight: 600;
      color: var(--text-secondary);
    }
    .lore-hit-badge {
      font-size: 0.92em;
      padding: 1px 7px;
      border-radius: 5px;
      background: var(--tag-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    /* 左右对话气泡 */
    .bubble {
      padding: 13px 17px;
      border-radius: 15px;
      line-height: 1.72;
      word-break: break-word;
      font-size: 0.98em;
      letter-spacing: 0.015em;
    }
    .msg-row.user .bubble {
      background: var(--bubble-user);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .bubble {
      background: var(--bubble-ai);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-soft);
    }

    /* 角色扮演排版美化：动作斜体、台词高亮 */
    .bubble p { margin-bottom: 0.65em; }
    .bubble p:last-child { margin-bottom: 0; }
    .rp-action {
      color: var(--text-secondary);
      font-style: italic;
    }
    .rp-quote {
      color: var(--text-dialogue);
      font-weight: 450;
    }
    .bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--bg-deep);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.86em;
      border: 1px solid var(--border-subtle);
    }
    .bubble pre {
      background: var(--bg-deep);
      border: 1px solid var(--border-subtle);
      padding: 10px 13px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 0.85em;
    }
    .bubble hr {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 10px 0;
    }

    /* 触控友好的底部消息操作栏 */
    .msg-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .msg-row.user .msg-footer {
      flex-direction: row-reverse;
    }
    .swipe-nav {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 3px 7px;
      font-size: 0.76em;
      color: var(--text-secondary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .swipe-nav button {
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 0 6px;
      font-size: 1.08em;
    }
    .swipe-nav button:disabled { opacity: 0.28; }

    .msg-tools {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .tool-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.75em;
      padding: 4px 9px;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: background 0.15s, color 0.15s;
    }
    .tool-btn:hover, .tool-btn:active {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* 行内编辑框 */
    .inline-edit-box {
      width: 100%;
      min-width: min(460px, 78vw);
      margin-top: 5px;
    }
    .inline-edit-textarea {
      width: 100%;
      background: var(--bg-deep);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      border-radius: 10px;
      padding: 12px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }
    .inline-edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    /* 思考过程折叠框 */
    .reasoning-box {
      margin-bottom: 6px;
      width: 100%;
    }
    .reasoning-toggle {
      background: var(--bg-elevated);
      border: 1px dashed var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.76em;
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
    }
    .reasoning-content {
      margin-top: 5px;
      padding: 10px 13px;
      background: var(--bg-deep);
      border-left: 2px solid var(--border-strong);
      border-radius: 6px;
      font-size: 0.84em;
      color: var(--text-secondary);
      line-height: 1.6;
      white-space: pre-wrap;
      display: none;
    }
    .reasoning-content.open { display: block; }

    /* 底部输入区：适配 iPad Air 5 居中阅读轴 + 妙控键盘 */
    .input-area {
      padding: 10px 24px calc(14px + var(--safe-bottom));
      background: var(--bg-main);
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }
    @media (max-width: 560px) {
      .input-area {
        padding: 8px 10px calc(10px + var(--safe-bottom));
        border-top: 1px solid var(--border-subtle);
      }
    }
    .input-box {
      width: 100%;
      max-width: var(--content-max-width);
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 9px 12px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }
    .input-box:focus-within {
      border-color: var(--border-strong);
    }
    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      resize: none;
      max-height: 150px;
      min-height: 26px;
      padding: 3px 0;
    }
    .chat-textarea::placeholder {
      color: var(--text-muted);
      font-size: 0.92em;
    }
    .send-btn {
      background: var(--accent);
      color: var(--accent-contrast);
      border: none;
      border-radius: 9px;
      height: 36px;
      padding: 0 16px;
      font-weight: 600;
      font-size: 0.88em;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s;
    }
    .send-btn:disabled { opacity: 0.35; }

    /* 弹窗系统：iPad Air 5 采用居中悬浮大卡片，小屏手机自动回退底部抽屉 */
    .overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .overlay.open { display: flex; }

    .drawer, .modal {
      width: 100%;
      max-width: 720px;
      height: min(760px, 84dvh);
      max-height: 84dvh;
      background: var(--bg-deep);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      padding: 18px 22px 20px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    .sheet-pill {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--border-strong);
      margin: 0 auto 12px;
      flex-shrink: 0;
      display: none;
    }
    @media (max-width: 599px) {
      .overlay {
        align-items: flex-end;
        padding: 0;
      }
      .drawer, .modal {
        max-width: 100%;
        height: 88dvh;
        max-height: 88dvh;
        border-radius: 18px 18px 0 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        padding: 14px 15px calc(16px + var(--safe-bottom));
      }
      .sheet-pill { display: block; }
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 4px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    .panel-title {
      color: var(--text-primary);
      font-size: 1.02em;
      font-weight: 600;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 0.8em;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }
    .text-input, .select-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }
    .text-input:focus, .select-input:focus {
      border-color: var(--border-strong);
    }
    .section-card {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 0.88em;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* iPad 多列自适应网格 */
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .form-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 560px) {

  <script>
    // ====================================================
    // 1. 状态与本地持久化 (兼容旧版数据 + 多版本 Swipes + 世界书)
    // ====================================================
    const STORAGE_KEY = 'hi_creator_state_v1';

    const DEFAULT_STATE = {
      theme: 'dark',
      sessions: [
        { id: 1, name: '深夜书房 · 序章', updated_at: '刚刚' }
      ],
      activeSessionId: 1,

      messagesMap: {

            content: '*台灯调暗到了最柔和的灰度，桌面上摊开着那本写满设定的世界书。*\n\n"欢迎回来，Creator。书房已经针对你的 **iPad Air 5** 做好了大屏双栏与居中阅读适配。"\n\n横屏时左侧会话栏可常驻或点击左上角 `☰` 收起；点击顶部 `◈ 世界书` 或 `◎ 记忆` 将以 iPad 居中悬浮面板展开；每条消息下方均可直接点按 **重Roll (↻)**、**左右切换版本 (< 1/2 >)**、**编辑 (✎)** 或 **删除 (✕)**。',
            swipes: [
              {
                content: '*台灯调暗到了最柔和的灰度，桌面上摊开着那本写满设定的世界书。*\n\n"欢迎回来，Creator。书房已经针对你的 **iPad Air 5** 做好了大屏双栏与居中阅读适配。"\n\n横屏时左侧会话栏可常驻或点击左上角 `☰` 收起；点击顶部 `◈ 世界书` 或 `◎ 记忆` 将以 iPad 居中悬浮面板展开；每条消息下方均可直接点按 **重Roll (↻)**、**左右切换版本 (< 1/2 >)**、**编辑 (✎)** 或 **删除 (✕)**。',
                reasoning: '已完成 iPad Air 5 (10.9 英寸) 横竖屏自适应双栏布局、820px 居中黄金阅读轴与悬浮卡片适配。'
              }
            ],
            activeSwipe: 0,
            created_at: '23:40',
            visible: true
          }
        ]
      },
      lorebook: [
        {
          id: 1,
          title: '静谧书房 · 空间基底',
          keys: '书房, 基地, 房间',
          content: '这里是独立于时间之外的静谧书房，色调纯粹克制，桌面上总有一杯温热的黑咖啡，窗外是安静的夜色。',
          mode: 'constant',
          position: 'system',
          enabled: true
        }
      ],
      memories: [
        {
          id: 1,
          timestamp: '2026-06-05 22:00',
          conversation_id: '里程碑 · 建站纪念',
          tag: '重要节点',
          summary: 'Creator 建立了「Hi, Creator」静谧深夜书房，开启了跨会话的长期记忆与世界书设定集。'
        }
      ],
      settings: {
        user_name: 'Creator',
        char_name: 'Companion',
        first_message: '*轻轻合上手中的书页，抬眼看向你。*\n"你来了。今天想聊些什么？"',
        api_base: 'https://api.deepseek.com/v1',
        api_key: '',
        custom_model: '',
        system_prompt: '你是陪伴在 Creator 身边的专属伴侣。语气温和、沉静、真诚，善于使用细腻的动作与神态描写（置于 *星号* 内）配合自然对话。',
        temperature: 0.7,
        compress_rounds: 16,
        font_size: 16,
        font_name: '系统默认字体'
      }
    };

    let state = loadState();
    let isTyping = false;
    let editingMsgId = null;
    let editingLoreId = null;

    function normalizeMessages(messagesMap) {
      for (const sessId in messagesMap) {
        messagesMap[sessId] = (messagesMap[sessId] || []).map((m) => {
          if (!Array.isArray(m.swipes) || m.swipes.length === 0) {
            m.swipes = [{ content: m.content || '', reasoning: m.reasoning_content || '' }];
            m.activeSwipe = 0;
          } else {
            const idx = Math.min(Math.max(0, m.activeSwipe || 0), m.swipes.length - 1);
            m.activeSwipe = idx;
            m.content = m.swipes[idx].content;
            m.reasoning_content = m.swipes[idx].reasoning || '';
          }
          return m;
        });
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        const merged = {
          ...DEFAULT_STATE,
          ...parsed,
          lorebook: Array.isArray(parsed.lorebook) ? parsed.lorebook : DEFAULT_STATE.lorebook,
          settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) }
        };
        normalizeMessages(merged.messagesMap);
        return merged;
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // IndexedDB 存储本地自定义字体
    function openFontDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('HiCreatorFontDB', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('fonts')) db.createObjectStore('fonts');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveFontBuffer(name, buffer) {
      const db = await openFontDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('fonts', 'readwrite');
        tx.objectStore('fonts').put({ name, buffer }, 'active');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadSavedFont() {
      try {
        const db = await openFontDB();
        const record = await new Promise((resolve) => {
          const tx = db.transaction('fonts', 'readonly');
          const req = tx.objectStore('fonts').get('active');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
        if (record && record.buffer) {
          const font = new FontFace('CreatorCustomFont', record.buffer);
          await font.load();
          document.fonts.add(font);
          document.documentElement.style.setProperty('--custom-font', "'CreatorCustomFont', sans-serif");
          state.settings.font_name = record.name;
          document.getElementById('currentFontLabel').textContent = record.name;
        }
      } catch (err) {
        console.warn('加载自定义字体失败:', err);
      }
    }

    // ====================================================
    // 2. 美化前端文本渲染 (支持 *动作描写* 与 "台词高亮")
    // ====================================================
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function formatRichContent(raw) {
      let text = escapeHtml(raw || '');

      const codeBlocks = [];
      text = text.replace(/```([\s\S]*?)```/g, (_, code) => {
        codeBlocks.push(`<pre><code>${code.trim()}</code></pre>`);
        return `@@CODE_BLOCK_${codeBlocks.length - 1}@@`;
      });

      const inlineCodes = [];
      text = text.replace(/`([^`\n]+)`/g, (_, code) => {
        inlineCodes.push(`<code>${code}</code>`);
        return `@@INLINE_CODE_${inlineCodes.length - 1}@@`;
      });

      text = text.replace(/^---$/gm, '<hr/>');
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*([^*\n]+)\*/g, '<span class="rp-action">*$1*</span>');
      text = text.replace(/(“[^”\n]+”|"[^"\n]+")/g, '<span class="rp-quote">$1</span>');

      const paragraphs = text.split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, '<br/>')}</p>`);
      let result = paragraphs.join('');

      result = result.replace(/@@INLINE_CODE_(\d+)@@/g, (_, idx) => inlineCodes[Number(idx)]);
      result = result.replace(/@@CODE_BLOCK_(\d+)@@/g, (_, idx) => codeBlocks[Number(idx)]);

      return result;
    }

    // ====================================================
    // 3. 界面渲染
    // ====================================================

        document.documentElement.setAttribute('data-theme', 'light');

        document.documentElement.removeAttribute('data-theme');
      }
    }

      document.documentElement.style.setProperty('--base-font-size', (state.settings.font_size || 16) + 'px');
      document.getElementById('modelSelect').value = state.selectedModel;
      document.getElementById('memoryCount').textContent = state.memories.length;
      document.getElementById('loreCount').textContent = state.lorebook.filter((l) => l.enabled !== false).length;
      document.getElementById('brandTitleText').textContent = `Hi, ${state.settings.user_name || 'Creator'}`;
      renderSessions();
      renderMessages();
      renderLorebook();
      renderTimeline();

              <span>${curSwipe + 1}/${swipes.length}</span>

          return `

    // ====================================================
    // 4. 四层动态上下文组装 (System + 世界书 + 记忆时间线 + 近期对话)
    // ====================================================
    function buildFourLayerContext(sessionId, historyListOverride) {
      const rawHistory =
        historyListOverride ||
        (state.messagesMap[sessionId] || []).filter((m) => m.visible !== false);

      const recentScanText = rawHistory
        .slice(-6)
        .map((m) => m.content || '')
        .join('\n')
        .toLowerCase();

      const activeSysLore = [];
      const activeDepthLore = [];
      const triggeredNames = [];

      state.lorebook.forEach((entry) => {
        if (entry.enabled === false) return;
        let matched = false;
        if (entry.mode === 'constant') {
          matched = true;
        } else {
          const keys = (entry.keys || '')
            .split(/[,，]/)
            .map((k) => k.trim().toLowerCase())
            .filter(Boolean);
          if (keys.some((k) => recentScanText.includes(k))) {
            matched = true;
          }
        }
        if (matched && entry.content) {
          triggeredNames.push(entry.title || '设定');
          const formatted = `【${entry.title || '设定'}】：${entry.content}`;
          if (entry.position === 'depth') {
            activeDepthLore.push(formatted);
          } else {
            activeSysLore.push(formatted);
          }
        }
      });

      let systemText = state.settings.system_prompt || '';
      const userName = state.settings.user_name || 'Creator';
      const charName = state.settings.char_name || 'Companion';
      systemText += `\n当前你的名字是「${charName}」，用户的名字是「${userName}」。`;

      if (activeSysLore.length > 0) {
        systemText += `\n\n【世界书与核心设定 (World Info)】：\n${activeSysLore.join('\n')}`;
      }

      if (state.memories.length > 0) {
        const memoryLines = state.memories
          .slice(0, 25)
          .map((m) => `- [${m.timestamp} | ${m.tag || '记忆'}] ${m.summary}`)
          .join('\n');
        systemText += `\n\n【过去重要事件与记忆时间线】：\n${memoryLines}`;
      }

      const recentHistory = rawHistory.slice(-24).map((m) => ({
        role: m.role,
        content: m.content
      }));

      if (activeDepthLore.length > 0 && recentHistory.length > 0) {
        const depthMsg = {
          role: 'system',
          content: `【当前场景激活的世界书设定】：\n${activeDepthLore.join('\n')}`
        };
        recentHistory.splice(Math.max(0, recentHistory.length - 1), 0, depthMsg);
      }

      return {
        messages: [{ role: 'system', content: systemText }, ...recentHistory],
        triggeredLore: triggeredNames
      };
    }

    async function callChatAPI(messages, modelOverride) {
      const apiKey = (state.settings.api_key || '').trim();
      const baseUrl = (state.settings.api_base || 'https://api.openai.com/v1').replace(/\/+$/, '');
      const model = (state.settings.custom_model || '').trim() || modelOverride || state.selectedModel;

      if (!apiKey) {
        await new Promise((r) => setTimeout(r, 500));
        return {
          reasoning: `iPad Air 5 本地预览模式（已扫描 ${state.lorebook.filter((l) => l.enabled !== false).length} 条世界书词条与 ${state.memories.length} 条记忆）。`,
          content: `*指尖轻轻点过桌面，灰白色的光影安静流淌。*\n\n"我已经收到你的话了。点按右上角 \`⚙\` 填入 API Base URL 和 API Key，就能在 iPad 上随时与我真实对话。"\n\n你也可以直接点击下方的 \`↻ 重Roll\` 按钮测试多版本切换。`
        };
      }

      const res = await fetch(`${baseUrl}/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model,
          messages,
          temperature: Number(state.settings.temperature) ?? 0.7
        })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`API 请求错误 (${res.status}): ${errText}`);
      }

      const data = await res.json();
      const msg = data.choices?.[0]?.message || {};
      return {
        reasoning: msg.reasoning_content || '',
        content: msg.content || '（未返回正文内容）'
      };
    }

    // ====================================================
    // 5. 发送消息与重Roll (多版本 Swipes)
    // ====================================================
    const chatInputEl = document.getElementById('chatInput');
    chatInputEl.addEventListener('input', () => {
      chatInputEl.style.height = 'auto';
      chatInputEl.style.height = Math.min(chatInputEl.scrollHeight, 150) + 'px';
    });

    async function handleSend() {
      const text = chatInputEl.value.trim();
      if (!text || isTyping) return;

      const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const sessId = state.activeSessionId;
      if (!state.messagesMap[sessId]) state.messagesMap[sessId] = [];

      state.messagesMap[sessId].push({
        id: Date.now(),
        role: 'user',
        content: text,
        swipes: [{ content: text, reasoning: '' }],
        activeSwipe: 0,
        created_at: nowTime,
        visible: true
      });

      const sess = state.sessions.find((s) => s.id === sessId);
      if (sess) sess.updated_at = nowTime;

      chatInputEl.value = '';
      chatInputEl.style.height = 'auto';
      await generateAssistantReply(sessId);
    }

    async function generateAssistantReply(sessId, targetAssistantMsg = null) {
      if (isTyping) return;
      isTyping = true;
      saveState();
      renderAll();

      const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const fullList = state.messagesMap[sessId] || [];

      let contextHistory = fullList.filter((m) => m.visible !== false);
      if (targetAssistantMsg) {
        const idx = contextHistory.findIndex((m) => m.id === targetAssistantMsg.id);
        if (idx !== -1) {
          contextHistory = contextHistory.slice(0, idx);
        }
      }

      try {
        const { messages, triggeredLore } = buildFourLayerContext(sessId, contextHistory);
        const reply = await callChatAPI(messages);

        if (targetAssistantMsg) {
          if (!Array.isArray(targetAssistantMsg.swipes)) {
            targetAssistantMsg.swipes = [{ content: targetAssistantMsg.content, reasoning: targetAssistantMsg.reasoning_content || '' }];
          }
          targetAssistantMsg.swipes.push({
            content: reply.content,
            reasoning: reply.reasoning
          });
          targetAssistantMsg.activeSwipe = targetAssistantMsg.swipes.length - 1;
          targetAssistantMsg.content = reply.content;
          targetAssistantMsg.reasoning_content = reply.reasoning;
          targetAssistantMsg.triggered_lore = triggeredLore;
          targetAssistantMsg.created_at = nowTime;
        } else {
          fullList.push({
            id: Date.now() + 1,
            role: 'assistant',
            reasoning_content: reply.reasoning,
            content: reply.content,
            swipes: [{ content: reply.content, reasoning: reply.reasoning }],
            activeSwipe: 0,
            triggered_lore: triggeredLore,
            created_at: nowTime,
            visible: true
          });

          const visibleCount = fullList.filter((m) => m.visible !== false).length;
          const threshold = (Number(state.settings.compress_rounds) || 16) * 2;
          if (visibleCount >= threshold) {
            await summarizeSessionToTimeline(sessId, true);
          }
        }
      } catch (err) {
        if (targetAssistantMsg) {
          alert(`重Roll 失败: ${err.message}`);
        } else {
          fullList.push({
            id: Date.now() + 1,
            role: 'assistant',
            content: `*连接模型时出现了一点状况：*\n\`${err.message}\``,
            swipes: [{ content: `*连接模型时出现了一点状况：*\n\`${err.message}\``, reasoning: '' }],
            activeSwipe: 0,
            created_at: nowTime,
            visible: true
          });
        }
      } finally {
        isTyping = false;
        saveState();
        renderAll();
      }
    }

    async function summarizeSessionToTimeline(sessionId, isAuto = false) {
      const visibleList = (state.messagesMap[sessionId] || []).filter((m) => m.visible !== false);
      if (visibleList.length < 2) {
        if (!isAuto) alert('当前对话内容还太少，先聊几句再提炼吧。');
        return;
      }

      const toSummarize = isAuto ? visibleList.slice(0, Math.max(2, visibleList.length - 6)) : visibleList;
      const userName = state.settings.user_name || 'Creator';
      const charName = state.settings.char_name || 'Companion';
      const dialogueText = toSummarize
        .map((m) => `${m.role === 'user' ? userName : charName}: ${m.content}`)
        .join('\n');

      const apiKey = (state.settings.api_key || '').trim();
      let summaryText = '';

      if (apiKey) {
        try {
          const resp = await callChatAPI([
            {
              role: 'system',
              content: `请将以下 ${userName} 与 ${charName} 的对话浓缩为一段简明、温和的第三人称记忆摘要（100字以内），重点保留重要事件、情感变化或约定。`
            },
            { role: 'user', content: dialogueText }
          ]);
          summaryText = resp.content.trim();
        } catch (e) {
          console.warn('自动压缩调用失败:', e);
        }
      }

      if (!summaryText) {
        summaryText = `概述了 ${toSummarize.length} 条对话：${toSummarize[0].content.slice(0, 42)}...`;
      }

      const now = new Date();
      const ts = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const sess = state.sessions.find((s) => s.id === sessionId);

      state.memories.unshift({
        id: Date.now(),
        timestamp: ts,
        conversation_id: sess ? sess.name : '对话提炼',
        tag: isAuto ? '自动记忆压缩' : '记忆摘要',
        summary: summaryText
      });

      if (isAuto) {
        toSummarize.forEach((m) => {
          m.visible = false;
        });
      }

      saveState();
      renderAll();
    }

    // ====================================================
    // 6. iPad Air 5 侧栏自适应与触控/妙控键盘绑定
    // ====================================================
    const sidebarEl = document.getElementById('sidebar');
    const backdropEl = document.getElementById('sidebarBackdrop');

    // 初始化侧边栏：iPad 横屏 (>=900px) 默认展开，竖屏默认收起以留出最大阅读区
    function initResponsiveSidebar() {
      if (window.innerWidth < 900) {
        sidebarEl.classList.add('closed');
        backdropEl.classList.remove('open');
      } else {
        sidebarEl.classList.remove('closed');
        backdropEl.classList.remove('open');
      }
    }

    function toggleSidebar(forceClose = false) {
      if (forceClose || !sidebarEl.classList.contains('closed')) {
        sidebarEl.classList.add('closed');
        backdropEl.classList.remove('open');
      } else {
        sidebarEl.classList.remove('closed');
        if (window.innerWidth < 800) {
          backdropEl.classList.add('open');
        }
      }
    }

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 800) {
        backdropEl.classList.remove('open');
      } else if (!sidebarEl.classList.contains('closed')) {
        backdropEl.classList.add('open');
      }
    });

    document.getElementById('btnToggleSidebar').addEventListener('click', () => toggleSidebar(false));
    document.getElementById('btnCloseSidebarMobile').addEventListener('click', () => toggleSidebar(true));
    backdropEl.addEventListener('click', () => toggleSidebar(true));

    document.getElementById('btnSend').addEventListener('click', handleSend);
    chatInputEl.addEventListener('keydown', (e) => {
      // iPad 连接妙控键盘或桌面端：Enter 发送，Shift+Enter 换行
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.innerWidth >= 768) {
        e.preventDefault();
        handleSend();
      }
    });

    // 支持按 ESC 键快速关闭任何打开的 iPad 悬浮弹窗
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        ['lorebookOverlay', 'timelineOverlay', 'settingsOverlay'].forEach((id) => {
          document.getElementById(id).classList.remove('open');
        });
      }
    });

    document.getElementById('btnQuickReroll').addEventListener('click', () => {
      if (isTyping) return;
      const list = (state.messagesMap[state.activeSessionId] || []).filter((m) => m.visible !== false);
      if (list.length === 0) return;
      const lastMsg = list[list.length - 1];
      if (lastMsg.role === 'assistant') {
        generateAssistantReply(state.activeSessionId, lastMsg);
      } else {
        generateAssistantReply(state.activeSessionId, null);
      }
    });

    document.getElementById('btnToggleTheme').addEventListener('click', () => {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      saveState();
      applyTheme();
    });

    document.getElementById('btnNewSession').addEventListener('click', () => {
      const id = Date.now();
      const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      state.sessions.unshift({
        id,
        name: `新的夜谈 ${state.sessions.length + 1}`,
        updated_at: '刚刚'
      });
      const firstMsg = (state.settings.first_message || '').trim();
      state.messagesMap[id] = firstMsg
        ? [
            {
              id: id + 1,
              role: 'assistant',
              content: firstMsg,
              swipes: [{ content: firstMsg, reasoning: '' }],
              activeSwipe: 0,
              created_at: nowTime,
              visible: true
            }
          ]
        : [];
      state.activeSessionId = id;
      saveState();
      renderAll();
      if (window.innerWidth < 800) toggleSidebar(true);
    });

    document.getElementById('sessionList').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (btn) {
        e.stopPropagation();
        const id = Number(btn.dataset.id);
        const action = btn.dataset.action;
        if (action === 'rename') {
          const target = state.sessions.find((s) => s.id === id);
          const next = prompt('重命名这个对话：', target?.name || '');
          if (next && next.trim() && target) {
            target.name = next.trim();
            saveState();
            renderSessions();
          }
        } else if (action === 'delete') {
          if (state.sessions.length <= 1) return alert('至少保留一个对话窗口。');
          state.sessions = state.sessions.filter((s) => s.id !== id);
          delete state.messagesMap[id];
          if (state.activeSessionId === id) state.activeSessionId = state.sessions[0].id;
          saveState();
          renderAll();
        }
        return;
      }

      const item = e.target.closest('.session-item');
      if (item) {
        state.activeSessionId = Number(item.dataset.id);
        editingMsgId = null;
        saveState();
        renderAll();
        if (window.innerWidth < 800) toggleSidebar(true);
      }
    });

    // 消息操控：思考展开、版本切换、重Roll、编辑、删除、截断
    document.getElementById('messageList').addEventListener('click', (e) => {
      const reasonBtn = e.target.closest('.reasoning-toggle');
      if (reasonBtn) {
        const id = reasonBtn.dataset.toggleId;
        const box = document.getElementById(`reason-${id}`);
        if (box) {
          const isOpen = box.classList.toggle('open');
          reasonBtn.textContent = isOpen ? '▾ 收起思考过程 / 内心独白' : '▸ 思考过程 / 内心独白';
        }
        return;
      }

      const sessList = state.messagesMap[state.activeSessionId] || [];

      const swipeBtn = e.target.closest('[data-swipe-dir]');
      if (swipeBtn) {
        const msgId = Number(swipeBtn.dataset.msgId);
        const dir = Number(swipeBtn.dataset.swipeDir);
        const target = sessList.find((m) => m.id === msgId);
        if (target && Array.isArray(target.swipes)) {
          const nextIdx = Math.min(Math.max(0, (target.activeSwipe || 0) + dir), target.swipes.length - 1);
          target.activeSwipe = nextIdx;
          target.content = target.swipes[nextIdx].content;
          target.reasoning_content = target.swipes[nextIdx].reasoning || '';
          saveState();
          renderMessages();
        }
        return;
      }

      const saveEditBtn = e.target.closest('[data-edit-save]');
      if (saveEditBtn) {
        const msgId = Number(saveEditBtn.dataset.editSave);
        const inputEl = document.getElementById(`edit-input-${msgId}`);
        const target = sessList.find((m) => m.id === msgId);
        if (target && inputEl) {
          const newVal = inputEl.value.trim();
          if (newVal) {
            target.content = newVal;
            if (Array.isArray(target.swipes) && target.swipes[target.activeSwipe || 0]) {
              target.swipes[target.activeSwipe || 0].content = newVal;
            }
          }
          editingMsgId = null;
          saveState();
          renderMessages();
        }
        return;
      }

      const cancelEditBtn = e.target.closest('[data-edit-cancel]');
      if (cancelEditBtn) {
        editingMsgId = null;
        renderMessages();
        return;
      }

      const toolBtn = e.target.closest('[data-msg-action]');
      if (toolBtn) {
        const msgId = Number(toolBtn.dataset.msgId);
        const action = toolBtn.dataset.msgAction;
        const targetIdx = sessList.findIndex((m) => m.id === msgId);
        if (targetIdx === -1) return;
        const targetMsg = sessList[targetIdx];

        if (action === 'edit') {
          editingMsgId = msgId;
          renderMessages();
        } else if (action === 'delete') {
          sessList.splice(targetIdx, 1);
          saveState();
          renderMessages();
        } else if (action === 'truncate') {
          if (confirm('确定删除此条及之后的所有消息吗？')) {
            sessList.splice(targetIdx);
            saveState();
            renderMessages();
          }
        } else if (action === 'reroll') {
          if (isTyping) return;
          if (targetMsg.role === 'assistant') {
            generateAssistantReply(state.activeSessionId, targetMsg);
          } else {
            const nextMsg = sessList[targetIdx + 1];
            if (nextMsg && nextMsg.role === 'assistant') {
              generateAssistantReply(state.activeSessionId, nextMsg);
            } else {
              generateAssistantReply(state.activeSessionId, null);
            }
          }
        }
      }
    });

    document.getElementById('modelSelect').addEventListener('change', (e) => {
      state.selectedModel = e.target.value;
      saveState();
    });

    // ====================================================
    // 7. 世界书 (Lorebook) 管理
    // ====================================================
    document.getElementById('btnOpenLorebook').addEventListener('click', () => {
      document.getElementById('lorebookOverlay').classList.add('open');
      renderLorebook();
    });
    document.getElementById('btnCloseLorebook').addEventListener('click', () => {
      document.getElementById('lorebookOverlay').classList.remove('open');
    });
    document.getElementById('loreSearch').addEventListener('input', renderLorebook);

    function resetLoreForm() {
      editingLoreId = null;
      document.getElementById('loreFormTitle').textContent = '＋ 新增世界书词条';
      document.getElementById('btnCancelLoreEdit').style.display = 'none';
      document.getElementById('loreTitleInput').value = '';
      document.getElementById('loreKeysInput').value = '';
      document.getElementById('loreContentInput').value = '';
      document.getElementById('loreModeSelect').value = 'constant';
      document.getElementById('lorePosSelect').value = 'system';
    }

    document.getElementById('btnCancelLoreEdit').addEventListener('click', resetLoreForm);

    document.getElementById('btnSaveLore').addEventListener('click', () => {
      const title = document.getElementById('loreTitleInput').value.trim();
      const keys = document.getElementById('loreKeysInput').value.trim();
      const content = document.getElementById('loreContentInput').value.trim();
      const mode = document.getElementById('loreModeSelect').value;
      const position = document.getElementById('lorePosSelect').value;

      if (!content) return alert('请填写世界书设定内容。');

      if (editingLoreId) {
        const target = state.lorebook.find((l) => l.id === editingLoreId);
        if (target) {
          target.title = title || '未命名词条';
          target.keys = keys;
          target.content = content;
          target.mode = mode;
          target.position = position;
        }
      } else {
        state.lorebook.unshift({
          id: Date.now(),
          title: title || '未命名词条',
          keys,
          content,
          mode,
          position,
          enabled: true
        });
      }

      resetLoreForm();
      saveState();
      renderAll();
    });

    document.getElementById('loreList').addEventListener('click', (e) => {
      const toggleEl = e.target.closest('[data-lore-toggle]');
      if (toggleEl) {
        const id = Number(toggleEl.dataset.loreToggle);
        const target = state.lorebook.find((l) => l.id === id);
        if (target) {
          target.enabled = toggleEl.checked;
          saveState();
          renderAll();
        }
        return;
      }

      const editBtn = e.target.closest('[data-lore-edit]');
      if (editBtn) {
        const id = Number(editBtn.dataset.loreEdit);
        const target = state.lorebook.find((l) => l.id === id);
        if (target) {
          editingLoreId = id;
          document.getElementById('loreFormTitle').textContent = '✎ 编辑词条';
          document.getElementById('btnCancelLoreEdit').style.display = 'inline-flex';
          document.getElementById('loreTitleInput').value = target.title || '';
          document.getElementById('loreKeysInput').value = target.keys || '';
          document.getElementById('loreContentInput').value = target.content || '';
          document.getElementById('loreModeSelect').value = target.mode || 'constant';
          document.getElementById('lorePosSelect').value = target.position || 'system';
        }
        return;
      }

      const delBtn = e.target.closest('[data-lore-del]');
      if (delBtn) {
        const id = Number(delBtn.dataset.loreDel);
        state.lorebook = state.lorebook.filter((l) => l.id !== id);
        if (editingLoreId === id) resetLoreForm();
        saveState();
        renderAll();
      }
    });

    document.getElementById('btnExportLore').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state.lorebook, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Lorebook_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importLoreInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const list = Array.isArray(parsed) ? parsed : parsed.lorebook;
          if (Array.isArray(list)) {
            state.lorebook = [...list, ...state.lorebook];
            saveState();
            renderAll();
            alert(`已导入 ${list.length} 条世界书设定。`);
          }
        } catch (err) {
          alert('读取 JSON 失败。');
        }
      };
      reader.readAsText(file);
    });

    // ====================================================
    // 8. 记忆时间线与设置
    // ====================================================
    document.getElementById('btnOpenTimeline').addEventListener('click', () => {
      document.getElementById('timelineOverlay').classList.add('open');
      renderTimeline();
    });
    document.getElementById('btnCloseTimeline').addEventListener('click', () => {
      document.getElementById('timelineOverlay').classList.remove('open');
    });
    document.getElementById('memorySearch').addEventListener('input', renderTimeline);

    document.getElementById('btnAddMemory').addEventListener('click', () => {
      const textEl = document.getElementById('newMemoryText');
      const tagEl = document.getElementById('newMemoryTag');
      const val = textEl.value.trim();
      if (!val) return;

      const now = new Date();
      const ts = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const sess = state.sessions.find((s) => s.id === state.activeSessionId);

      state.memories.unshift({
        id: Date.now(),
        timestamp: ts,
        conversation_id: sess ? sess.name : '手动记录',
        tag: tagEl.value,
        summary: val
      });
      textEl.value = '';
      saveState();
      renderAll();
    });

    document.getElementById('btnAutoSummarizeNow').addEventListener('click', () => {
      summarizeSessionToTimeline(state.activeSessionId, false);
    });

    document.getElementById('timelineList').addEventListener('click', (e) => {
      const delBtn = e.target.closest('[data-del-mem]');
      if (!delBtn) return;
      const memId = Number(delBtn.dataset.delMem);
      state.memories = state.memories.filter((m) => m.id !== memId);
      saveState();
      renderAll();
    });

    document.getElementById('btnOpenSettings').addEventListener('click', () => {
      document.getElementById('cfgUserName').value = state.settings.user_name || 'Creator';
      document.getElementById('cfgCharName').value = state.settings.char_name || 'Companion';
      document.getElementById('cfgFirstMsg').value = state.settings.first_message || '';
      document.getElementById('cfgApiBase').value = state.settings.api_base || '';
      document.getElementById('cfgApiKey').value = state.settings.api_key || '';
      document.getElementById('cfgCustomModel').value = state.settings.custom_model || '';
      document.getElementById('cfgSystemPrompt').value = state.settings.system_prompt || '';
      document.getElementById('cfgTemp').value = state.settings.temperature ?? 0.7;
      document.getElementById('cfgCompressRounds').value = state.settings.compress_rounds || 16;
      document.getElementById('fontSizeSlider').value = state.settings.font_size || 16;
      document.getElementById('fontSizeLabel').textContent = state.settings.font_size || 16;
      document.getElementById('currentFontLabel').textContent = state.settings.font_name || '系统默认字体';
      document.getElementById('settingsOverlay').classList.add('open');
    });

    document.getElementById('btnCloseSettings').addEventListener('click', () => {
      state.settings.user_name = document.getElementById('cfgUserName').value.trim() || 'Creator';
      state.settings.char_name = document.getElementById('cfgCharName').value.trim() || 'Companion';
      state.settings.first_message = document.getElementById('cfgFirstMsg').value;
      state.settings.api_base = document.getElementById('cfgApiBase').value.trim();
      state.settings.api_key = document.getElementById('cfgApiKey').value.trim();
      state.settings.custom_model = document.getElementById('cfgCustomModel').value.trim();
      state.settings.system_prompt = document.getElementById('cfgSystemPrompt').value;
      state.settings.temperature = Number(document.getElementById('cfgTemp').value) ?? 0.7;
      state.settings.compress_rounds = Number(document.getElementById('cfgCompressRounds').value) || 16;
      saveState();
      renderAll();
      document.getElementById('settingsOverlay').classList.remove('open');
    });

    document.getElementById('fontSizeSlider').addEventListener('input', (e) => {
      const val = Number(e.target.value);
      state.settings.font_size = val;
      document.getElementById('fontSizeLabel').textContent = val;
      document.documentElement.style.setProperty('--base-font-size', val + 'px');
      saveState();
    });

    document.getElementById('fontFileInput').addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const statusEl = document.getElementById('fontStatusMsg');
      statusEl.textContent = '加载中...';
      try {
        const buffer = await file.arrayBuffer();
        const font = new FontFace('CreatorCustomFont', buffer);
        await font.load();
        document.fonts.add(font);
        document.documentElement.style.setProperty('--custom-font', "'CreatorCustomFont', sans-serif");
        await saveFontBuffer(file.name, buffer);
        state.settings.font_name = file.name;
        saveState();
        document.getElementById('currentFontLabel').textContent = file.name;
        statusEl.textContent = `✓ 已启用`;
      } catch (err) {
        statusEl.textContent = '✕ 格式不支持';
      }
    });

    document.getElementById('btnResetFont').addEventListener('click', async () => {
      const db = await openFontDB();
      const tx = db.transaction('fonts', 'readwrite');
      tx.objectStore('fonts').delete('active');
      document.documentElement.style.removeProperty('--custom-font');
      state.settings.font_name = '系统默认字体';
      saveState();
      document.getElementById('currentFontLabel').textContent = '系统默认字体';
      document.getElementById('fontStatusMsg').textContent = '已恢复默认';
    });

    document.getElementById('btnExportData').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `HiCreator_Backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importDataInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (imported.sessions && imported.messagesMap) {
            normalizeMessages(imported.messagesMap);
            state = {
              ...DEFAULT_STATE,
              ...imported,
              lorebook: Array.isArray(imported.lorebook) ? imported.lorebook : DEFAULT_STATE.lorebook,
              settings: { ...DEFAULT_STATE.settings, ...(imported.settings || {}) }
            };
            saveState();
            renderAll();
            alert('备份恢复成功。');
          }
        } catch (err) {
          alert('备份文件格式不正确。');
        }
      };
      reader.readAsText(file);
    });

    ['lorebookOverlay', 'timelineOverlay', 'settingsOverlay'].forEach((id) => {
      const el = document.getElementById(id);
      el.addEventListener('click', (e) => {
        if (e.target === el) el.classList.remove('open');
      });
    });

    initResponsiveSidebar();
    loadSavedFont();
    renderAll();
  </script>
</body>
</html>
